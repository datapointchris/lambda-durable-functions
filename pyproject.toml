[project]
name = "lambda-durable-functions"
version = "0.1.0"
description = "Lambda durable functions: a worked, tested reference implementation."
# Lambda's Python runtime, not Glue's. The parent lakeworks floor of 3.11 exists
# because Glue 5.0 ships 3.11; nothing here runs on Glue.
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "aws-durable-execution-sdk-python>=1.7.0",
]

[project.optional-dependencies]
cattrs = ["cattrs>=24"]
dev = [
    "cattrs>=24",
    "aws-durable-execution-sdk-python-testing>=1.2.1",
    "pytest>=8.0",
    "ruff",
    "basedpyright",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landing_zone"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "ARG"]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

verbosity_assertions = 2

# `standard` rather than basedpyright's `recommended` default, matching the
# shared default. Named `pyright` so basedpyright and Pylance both read it.
[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
analyzeUnannotatedFunctions = true

[tool.mypy]
pretty = true
# Unlike the shared default, imports are not ignored. An unresolved
# aws_durable_execution_sdk_python turns every decorated handler into Any and
# silently hides the call-arity errors basedpyright reports.
ignore_missing_imports = false

check_untyped_defs = false
warn_return_any = false

# boto3 ships no type information and no stub package is installed. Scoped to
# boto3 rather than set globally: an unresolved aws_durable_execution_sdk_python
# must still fail, because that import silently becoming Any is what hides the
# call-arity errors basedpyright reports. See docs/typing-and-tooling.md.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.codespell]
check-filenames = true

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]
