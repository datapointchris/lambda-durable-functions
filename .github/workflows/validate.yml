# forge-toolchain: 26
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  python:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:python
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Before the sync, which would rewrite a stale lock rather than fail on
      # it. uvx, so the uv is the one the uv-lock hook pins.
      - run: uvx uv@0.8.3 lock --check

      - run: uv sync --all-extras --dev

      # uvx, not `uv run` — the latter resolves ruff from the repo's own
      # dependencies, and a repo treating ruff as an installed tool rather than a
      # project dependency does not declare it. The version is the one the
      # pre-commit hook pins, so the two cannot disagree about a finding.
      - run: uvx ruff@0.12.5 check .

      - run: uvx ruff@0.12.5 format --check .

      # Declaring mypy as a dependency is the opt-in, and `uv run` is the same
      # invocation the pre-commit hook uses, so a repo passing locally passes
      # here. A [tool.mypy] section is not the opt-in: the standard pyproject
      # template writes one into every repo, infra repos included, and those
      # have nothing importable to check.
      # Tested by import rather than `mypy --version`: `uv run` falls back to
      # PATH, so a machine with mypy installed globally reports it present in a
      # repo that never declared it, and the check would pass locally while
      # behaving differently on a clean runner.
      - name: Type check
        run: |
          if uv run python -c "import mypy" >/dev/null 2>&1; then
            uv run mypy . --install-types --non-interactive
          else
            echo "mypy not a project dependency; skipping"
          fi

      # --with pytest, unlike the mypy step above, because skipping is the wrong
      # answer here: a repo with a real test suite that never declared pytest as
      # a dependency would silently stop being tested. Supplying the runner runs
      # the tests; a suite needing plugins still declares those itself.
      #
      # pytest exits 5 when it collects nothing, which is not a failure for a
      # repo that has no tests yet. Written explicitly rather than as an && chain
      # because the runner uses `bash -e`, where the concise form depends on
      # subtle errexit-exemption rules.
      - name: Test
        run: |
          set +e
          uv run --with pytest pytest
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          exit 1

  hooks:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:hooks
      # The hooks no other job in this workflow runs, which forge lists below
      # from the repo's committed config. A push from a checkout that never ran
      # `pre-commit install`, or a merge in the web UI, passes every hook by not
      # running it, and this is the gate that catches both.
      - uses: astral-sh/setup-uv@v7

      # A self-hosted runner keeps ~/.cache/pre-commit between jobs, so there
      # the archive is a download of what is already on disk.
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Over what the push or pull request changed, which is what the hooks
      # would have seen at commit time. --all-files would fail a push on every
      # finding in a file it never touched, so it is the scope only where no
      # earlier commit can be fetched, as on a repo's first push.
      #
      # The checkout is one commit deep, and diffing needs one more. pre-commit
      # falls back to a two-dot diff where the two commits share no history on
      # disk, and refcheck's --moves reads the range as a two-dot diff too, so
      # the base commit alone is enough.
      - name: Run the hooks over the change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 --no-tags origin "$BASE" 2>/dev/null; then
            scope=(--from-ref "$BASE" --to-ref HEAD)
          elif git fetch --quiet --depth=2 --no-tags origin "$(git rev-parse HEAD)" &&
            git rev-parse --quiet --verify HEAD~1 >/dev/null; then
            echo "::notice::this event names no base commit, so only the head commit's change is checked"
            scope=(--from-ref HEAD~1 --to-ref HEAD)
          else
            echo "::notice::no earlier commit to diff against, so every file is checked"
            scope=(--all-files)
          fi
          hooks=(
            check-yaml
            check-toml
            check-json
            end-of-file-fixer
            trailing-whitespace
            check-executables-have-shebangs
            check-shebang-scripts-are-executable
            check-added-large-files
            check-merge-conflict
            mixed-line-ending
            check-case-conflict
            detect-private-key
            check-json5
            markdownlint
            shellcheck
            shfmt
            codespell
            refcheck
          )
          # Every hook runs whatever the one before it found, so one push
          # reports every failing hook rather than the first.
          status=0
          for hook in "${hooks[@]}"; do
            uvx pre-commit run "$hook" "${scope[@]}" --show-diff-on-failure || status=1
          done
          exit "$status"
