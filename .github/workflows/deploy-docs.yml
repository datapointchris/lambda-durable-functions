name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # The docs hub pulls this artifact and rsyncs it to
      # /var/www/docs/lambda-durable-functions/. See the docs-lxc README,
      # "Adding a Repo to the Hub".
      - run: uv run --with mkdocs --with mkdocs-material mkdocs build --strict

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
